network:
  runner:
    host: "127.0.0.1"
    port: 10003
  NEONFC:
    host: "127.0.0.1"
    control_port: 10002
    data_port: 10001
  DIRECT:
    host: "224.5.23.2"
    port: "10010"

scenarios:
  TEST:
    template: "templates/opposite_corners_positions.yaml"
    strategy: "no_variance"
    assessments:
      - {"name": "TimeLimit", "config": {"limit": 5}}
      - {"name": "DistanceToCenter", "config": {"robot_ids": [0, 1]}}

  SHOOTOUT:
    template: "templates/penalty_kick_positions.yaml"
    strategy: "uniform_random"
    variance:
      ball:
        x: [-0.2, 0.2]
        y: [-0.5, 0.5]
      robots:
        blue:
          "0":
            x: [-0.2, 0.2]
            y: [-0.5, 0.5]
            theta: [-1.57, 1.57]
          "1":
            x: [-0.2, 0.2]
            y: [-0.5, 0.5]
            theta: [-1.57, 1.57]
    # Shootout semantics: the only OUTCOME reward is a scored goal
    # (+1.0 striker / -1.0 keeper via zero_sum). TimeLimit and
    # BallOutOfBounds still terminate episodes but emit 0.0 -- a
    # timeout or a dead ball says nothing about who won, so under
    # goal-only semantics they are neutral, not penalties. gamma < 1
    # supplies the time pressure (scoring sooner discounts less).
    #
    # On top of that, BallProgress adds potential-based shaping for the
    # striker: +weight per metre of closed striker-ball distance, per
    # frame. The first night of goal-only training collapsed: with a
    # flat Q the SAC entropy term drags the policy to the action-space
    # origin (the field centre) and the ball never moved (0 goals in
    # 200k transitions, 0.9% of frames within 0.5m of the ball). The
    # slope gives Q a gradient to descend before the first goal ever
    # fires; being potential-based it does not move the optimum, and
    # weight 0.5 keeps the full ~1.5m approach (~0.75) under the +1.0
    # goal. The keeper gets no slope so the goal stays open while the
    # striker bootstraps.
    #
    # Order matters: the first triggered assessment wins. A goal on the
    # final frame counts as a goal, not as a timeout.
    #
    # TimeLimit 25s: with the original 5s every episode ended in a
    # uniform timeout (the striker starts ~2m from the ball), so goals
    # were physically unreachable. 25s gives ~1500 transitions/episode
    # and time to actually score.
    assessments:
      - "GoalScored"
      - {"name": "TimeLimit", "config": {"limit": 25, "reward": 0.0}}
      - {"name": "BallOutOfBounds", "config": {"reward": 0.0}}
      - {"name": "BallProgress", "config": {"robot_id": 1, "weight": 0.5}}

  penalty_kick_gaussian:
    template: "templates/penalty_kick_positions.yaml"
    strategy: "gaussian_random"
    variance:
      ball:
        x: 0.05
        y: 0.05
      robots:
        blue:
          "0":
            y: 0.1
    assessments: 
      - "GoalScored"
      - {"name": "TimeLimit", "config": {"limit": 60}}
      - "BallStopped"
      - "BallOutOfBounds"
