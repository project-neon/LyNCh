network:
  runner:
    host: "127.0.0.1"
    port: 10003
  NEONFC:
    host: "127.0.0.1"
    control_port: 10002
    data_port: 10001
  DIRECT:
    host: "224.5.23.2"
    port: "10010"

scenarios:
  TEST:
    template: "templates/opposite_corners_positions.yaml"
    strategy: "no_variance"
    assessments:
      - {"name": "TimeLimit", "config": {"limit": 5}}
      - {"name": "DistanceToCenter", "config": {"robot_ids": [0, 1]}}

  SHOOTOUT:
    template: "templates/penalty_kick_positions.yaml"
    strategy: "uniform_random"
    variance:
      ball:
        x: [-0.2, 0.2]
        y: [-0.5, 0.5]
      robots:
        blue:
          "0":
            x: [-0.2, 0.2]
            y: [-0.5, 0.5]
            theta: [-1.57, 1.57]
          "1":
            x: [-0.2, 0.2]
            y: [-0.5, 0.5]
            theta: [-1.57, 1.57]
    assessments:
      - "GoalScored"
      - {"name": "TimeLimit", "config": {"limit": 5}}
      - "BallOutOfBounds"

  penalty_kick_gaussian:
    template: "templates/penalty_kick_positions.yaml"
    strategy: "gaussian_random"
    variance:
      ball:
        x: 0.05
        y: 0.05
      robots:
        blue:
          "0":
            y: 0.1
    assessments: 
      - "GoalScored"
      - {"name": "TimeLimit", "config": {"limit": 60}}
      - "BallStopped"
      - "BallOutOfBounds"
