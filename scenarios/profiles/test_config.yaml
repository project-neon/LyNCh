global:
  network:
    mode: "NEONFC"
    host: "127.0.0.1"
    port: 10001

scenarios:
  penalty_kick_uniform:
    template: "scenarios/templates/penalty_kick_positions.yaml"
    strategy: "uniform_random"
    seed: 84
    variance:
      ball:
        x: [-0.2, 0.2]
        y: [-0.5, 0.5]
      robots:
        yellow:
          "0":
            x: [-0.1, 0.1]
            theta: [-0.05, 0.05]
    assessments: ["GoalScored", "TimeLimit", "BallStopped"]

  penalty_kick_gaussian:
    template: "scenarios/templates/penalty_kick_positions.yaml"
    strategy: "gaussian_random"
    seed: 55
    variance:
      ball:
        x: 0.05
        y: 0.05
      robots:
        blue:
          "0":
            y: 0.1
    assessments: ["GoalScored", "TimeLimit"]
